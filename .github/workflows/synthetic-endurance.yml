name: Synthetic endurance tests

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netvue-synthetic-endurance-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_IMAGE: golang:1.26.1-bookworm@sha256:09fb8a652cf7a990b714c46a9f0f5fd2d5bc2222d995166b91907c1c05b7d0e8

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Repeat synthetic Go tests under the race detector
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            "$GO_IMAGE" \
            sh -ec 'go test -race -count=20 ./...'
