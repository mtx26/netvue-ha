name: Endurance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      race_count:
        description: "go test -race -count=N"
        default: "20"
        type: string
      fuzztime:
        description: "Duration per fuzz target (Go duration, e.g. 60s)"
        default: "60s"
        type: string
      endurance_count:
        description: "Repetitions of the multi-camera endurance tests"
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: endurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  race:
    name: Repeated tests under the race detector
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race -count=N
        env:
          RACE_COUNT: ${{ inputs.race_count || '20' }}
        run: go test -race -count="$RACE_COUNT" -timeout 50m ./...

  fuzz:
    name: Long fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz every target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
        run: bash scripts/ci/fuzz.sh "$FUZZTIME"

  multi-camera:
    name: Multi-camera endurance, goroutines and memory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true
      - name: Manager endurance tests (race detector)
        env:
          ENDURANCE_COUNT: ${{ inputs.endurance_count || '10' }}
        run: |
          go test -race -v -run 'Endurance' -count="$ENDURANCE_COUNT" \
            -timeout 40m ./internal/manager
