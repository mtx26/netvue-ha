name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
  MEDIAMTX_IMAGE: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change_scope:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.scope.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run integration and container jobs for non-documentation changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA")"
          if [[ -z "$changed_files" ]] || printf '%s\n' "$changed_files" |
            grep -Eqv '^(docs/|findings/|README\.md$)'; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go (test, race, vet, build, fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Short fuzz of every Fuzz target
        run: bash scripts/ci/fuzz.sh 2s

  ha:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-homeassistant.txt
      - run: pip install -r tests/requirements-homeassistant.txt
      - name: Static checks
        run: |
          pip install ruff==0.14.6
          ruff check --select E4,E7,E9,F --target-version py313 \
            custom_components/netvue_local tests scripts
      - run: python -m pytest tests/ha tests/test_home_assistant_integration.py tests/test_home_assistant_webrtc.py tests/test_ha_go_e2e_synthetic.py -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Card tests
        run: node --test tests/frontend/*.test.mjs

  build:
    name: Build integration binaries
    needs: change_scope
    if: needs.change_scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile bridge and test binaries once
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir bin
          go build -trimpath -buildvcs=false -o bin/netvue-bridge ./cmd/netvue-bridge
          go test -c -o bin/netvue-manager.test ./internal/manager
          go test -c -o bin/netvue.test ./internal/netvue
          go test -c -o bin/netvue-e2e.test ./tests/e2e
          go build -trimpath -buildvcs=false -o bin/netvue-sim ./tests/simulator/netvue-sim
      - name: Extract pinned MediaMTX
        run: |
          set -euo pipefail
          container="$(docker create "$MEDIAMTX_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/mediamtx" bin/mediamtx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-bin
          path: bin/
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration (MediaMTX, FFmpeg, WebRTC, audio, E2E)
    needs: [build, change_scope]
    if: needs.change_scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETVUE_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: integration-bin
          path: bin
      - name: Prepare binaries and pinned HA image
        run: |
          chmod +x bin/*
          docker pull "$HA_IMAGE"

      - name: Go integration tests (no skips allowed)
        run: |
          set -euo pipefail
          for bin in netvue-manager.test netvue.test netvue-e2e.test; do
            docker run --rm --network none \
              --mount "type=bind,source=$GITHUB_WORKSPACE/bin,target=/ci,readonly" \
              --env NETVUE_REQUIRE_INTEGRATION=1 \
              --env NETVUE_TEST_GO_BRIDGE=/ci/netvue-bridge \
              --env NETVUE_TEST_MEDIAMTX=/ci/mediamtx \
              --env NETVUE_TEST_FFMPEG=/usr/bin/ffmpeg \
              --env NETVUE_TEST_FFMPEG_FULL=/usr/bin/ffmpeg \
              --env NETVUE_TEST_FFPROBE=/usr/bin/ffprobe \
              --entrypoint "/ci/$bin" "$HA_IMAGE" -test.v \
              2>&1 | tee "$RUNNER_TEMP/$bin.log"
            if grep -E -- '^\s*--- SKIP' "$RUNNER_TEMP/$bin.log"; then
              echo "$bin: skipped tests are not allowed in the integration job" >&2
              exit 1
            fi
          done

      - name: MediaMTX runtime listener isolation
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/bin/mediamtx,target=/mediamtx,readonly" \
            --workdir /workspace --env NETVUE_TEST_MEDIAMTX=/mediamtx \
            --entrypoint python "$HA_IMAGE" \
            -B -m unittest discover -s tests -p test_portainer_config.py -v \
            2>&1 | tee "$RUNNER_TEMP/portainer.log"
          if grep -E -- '\.\.\. skipped' "$RUNNER_TEMP/portainer.log"; then
            echo "skipped tests are not allowed in the integration job" >&2
            exit 1
          fi

      - name: Home Assistant, Go bridge and synthetic LAN end-to-end
        run: |
          set -euo pipefail
          network="netvue-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          camera_container="${network}-camera"
          camera2_container="${network}-camera-b"
          cleanup() {
            docker rm -f "$camera_container" "$camera2_container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create --internal "$network"

          subnet="$(docker network inspect "$network" --format '{{(index .IPAM.Config 0).Subnet}}')"
          read -r camera_ip bridge_ip camera2_ip <<<"$(python3 -c '
          import ipaddress, sys
          network = ipaddress.ip_network(sys.argv[1])
          if network.version != 4 or network.num_addresses < 8:
              raise SystemExit("Docker assigned an unusable IPv4 subnet")
          print(network.network_address + 2, network.network_address + 3,
                network.network_address + 4)
          ' "$subnet")"

          docker run --detach --name "$camera_container" \
            --network "$network" --ip "$camera_ip" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/bin:/integration:ro" \
            --env NETVUE_TEST_SIMULATOR=/integration/netvue-sim \
            --env NETVUE_TEST_CAMERA_HOST="$camera_ip" \
            --entrypoint python "$HA_IMAGE" \
            -B /workspace/tests/ha_go_e2e_synthetic.py --camera
          docker run --detach --name "$camera2_container" \
            --network "$network" --ip "$camera2_ip" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/bin:/integration:ro" \
            --env NETVUE_TEST_SIMULATOR=/integration/netvue-sim \
            --env NETVUE_TEST_CAMERA_HOST="$camera2_ip" \
            --env NETVUE_TEST_REJECT_INITIAL_LOGIN=0 \
            --entrypoint python "$HA_IMAGE" \
            -B /workspace/tests/ha_go_e2e_synthetic.py --camera

          if ! timeout 300s docker run --rm \
            --network "$network" --ip "$bridge_ip" \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/bin:/integration:ro" \
            --workdir /workspace --env PYTHONPATH=/workspace \
            --env NETVUE_TEST_COMPONENT=/workspace/custom_components/netvue_local \
            --env NETVUE_TEST_MEDIAMTX=/integration/mediamtx \
            --env NETVUE_TEST_MEDIAMTX_CONFIG=/workspace/deployment/mediamtx.yml \
            --env NETVUE_TEST_GO_BRIDGE=/integration/netvue-bridge \
            --env NETVUE_TEST_CAMERA_HOST="$camera_ip" \
            --env NETVUE_TEST_CAMERA_2_HOST="$camera2_ip" \
            --entrypoint python "$HA_IMAGE" \
            -B /workspace/tests/ha_go_e2e_synthetic.py; then
            docker logs "$camera_container" >&2 || true
            docker logs "$camera2_container" >&2 || true
            exit 1
          fi

  docker:
    name: Docker image and Portainer stack
    needs: change_scope
    if: needs.change_scope.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build, start and query /api/v1/status (not published)
        run: |
          set -euo pipefail
          image="netvue-bridge:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="netvue-image-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker build --file Dockerfile --tag "$image" .
          docker run --detach --name "$container" --network host \
            "$image" serve --source 127.0.0.1 --listen 127.0.0.1:18765

          for ((attempt = 1; attempt <= 50; attempt++)); do
            if response="$(curl --fail --silent http://127.0.0.1:18765/api/v1/status)"; then
              printf '%s' "$response" | jq -e '.cameras == []' >/dev/null
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.2
          done
          docker logs "$container"
          echo "Docker image did not serve its status API" >&2
          exit 1
      - name: Validate the Portainer stack (render only, no deployment)
        env:
          NETVUE_NODE: ci-runner
          NETVUE_SOURCE: 192.168.1.10
          NETVUE_BRIDGE_IMAGE: ghcr.io/mtx26/netvue-bridge-go:ci-test
        run: docker stack config --compose-file deployment/go-stack.yaml >/dev/null

  publish:
    name: Publish image (main only)
    needs: [go, ha, integration, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/mtx26/netvue-bridge-go
        run: |
          metadata_file="$(mktemp)"
          trap 'rm -f "$metadata_file"' EXIT
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            --metadata-file "$metadata_file" \
            --push .

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          echo "Published \`$IMAGE@$digest\` from commit \`$GITHUB_SHA\`." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Package matching Home Assistant integration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: netvue-local-${{ github.sha }}
          path: |
            custom_components/netvue_local/
            !custom_components/netvue_local/**/__pycache__/**
            !custom_components/netvue_local/**/*.pyc
          if-no-files-found: error
