version: "3.8"

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc
    command: ["/mediamtx.yml"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [host]
    volumes:
      - type: bind
        source: ${NETVUE_MEDIAMTX_CONFIG:?set the existing MediaMTX config volume path}
        target: /mediamtx.yml
        read_only: true
    stop_grace_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NETVUE_NODE:?set the Home Assistant node hostname}
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

  bridge:
    image: ${NETVUE_BRIDGE_IMAGE:-ghcr.io/mtx26/netvue-ha:phase16}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [host]
    command:
      - run
      - --source
      - ${NETVUE_SOURCE:?set the authorized LAN source}
      - --target
      - ${NETVUE_TARGET:?set the authorized camera}
      - --state-dir
      - /state
    volumes:
      - type: bind
        source: ${NETVUE_STATE_DIR:?set the existing persistent state volume path}
        target: /state
    stop_signal: SIGTERM
    stop_grace_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NETVUE_NODE:?set the Home Assistant node hostname}
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

networks:
  host:
    external: true
    name: host
