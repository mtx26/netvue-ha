version: "3.8"

services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.4@sha256:c730bccdbc8739f8f0c13cefe9bea8b61926f599b88fa4d0d229baa91846c7bc
    command: ["/mediamtx.yml"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [host]
    environment:
      MTX_LOGLEVEL: "warn"
      MTX_LOGDESTINATIONS: "stdout"
      MTX_DUMPPACKETS: "false"
      MTX_RTSP: "true"
      MTX_RTSPADDRESS: "127.0.0.1:8554"
      MTX_RTSPTRANSPORTS: "tcp"
      MTX_RTSPENCRYPTION: "no"
      MTX_RTMP: "false"
      MTX_HLS: "false"
      MTX_WEBRTC: "false"
      MTX_SRT: "false"
      MTX_MOQ: "false"
      MTX_API: "true"
      MTX_APIADDRESS: "127.0.0.1:9997"
      MTX_METRICS: "false"
      MTX_PPROF: "false"
      MTX_PLAYBACK: "true"
      MTX_PLAYBACKADDRESS: "127.0.0.1:9996"
      MTX_PATHDEFAULTS_RECORD: "false"
      MTX_PATHDEFAULTS_RECORDFORMAT: "fmp4"
      MTX_PATHDEFAULTS_RECORDPATH: "/recordings/%path/%Y-%m-%d_%H-%M-%S-%f"
      MTX_PATHDEFAULTS_RECORDPARTDURATION: "1s"
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: "10m"
      MTX_PATHDEFAULTS_RECORDMAXPARTSIZE: "50M"
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: "0s"
      MTX_PATHDEFAULTS_OVERRIDEPUBLISHER: "false"
    volumes:
      - type: bind
        source: ${NETVUE_RECORDINGS_DIR:-/var/lib/netvue/recordings}
        target: /recordings
        bind:
          create_host_path: true
    stop_grace_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NETVUE_NODE:?set the node shared with Home Assistant}
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

  netvue-bridge:
    image: ${NETVUE_BRIDGE_IMAGE:-ghcr.io/mtx26/netvue-bridge-go:latest}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [host]
    command:
      - serve
      - --source
      - ${NETVUE_SOURCE:?set the host LAN IPv4 address}
      - --listen
      - 127.0.0.1:8765
    environment:
      NETVUE_CLOUDFLARE_TURN_KEY_ID: "${NETVUE_CLOUDFLARE_TURN_KEY_ID:-}"
      NETVUE_CLOUDFLARE_TURN_API_TOKEN: "${NETVUE_CLOUDFLARE_TURN_API_TOKEN:-}"
      NETVUE_RECORDINGS_DIR: "/recordings"
      NETVUE_RECORDING_RETENTION: "${NETVUE_RECORDING_RETENTION:-168h}"
      NETVUE_RECORDING_LIMIT_BYTES: "${NETVUE_RECORDING_LIMIT_BYTES:-0}"
    volumes:
      - type: bind
        source: ${NETVUE_RECORDINGS_DIR:-/var/lib/netvue/recordings}
        target: /recordings
        bind:
          create_host_path: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${NETVUE_NODE:?set the node shared with Home Assistant}
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        order: stop-first
      rollback_config:
        order: stop-first

networks:
  host:
    external: true
    name: host
